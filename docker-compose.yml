# ============================================================
# HR Platform — Production docker-compose
#
# Xizmatlar:
#   db            — PostgreSQL 16
#   redis         — Channels layer (WebSocket / AI Interview) uchun
#   web           — Django + Daphne (ASGI, HTTP va WebSocket)
#   bot_auth      — apps/users1/bot.py (Telegram OTP/login boti)
#   bot_vacancy   — vacancy_bot/bot.py (HR vakansiya boti)
#   nginx         — reverse proxy, static/media, SSL termination
# ============================================================

services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Portni tashqariga OCHMAYMIZ (faqat ichki tarmoqda) — xavfsizlik uchun.
    # Agar tashqaridan (masalan pgAdmin bilan) ulanish kerak bo'lsa, SSH tunnel ishlatish kk.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/ruxshona2103/hr_project_web:latest
    restart: unless-stopped
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    env_file:
      - .env
    environment:
      # Faqat "web" migratsiya/collectstatic bajaradi — botlar bajarmaydi.
      RUN_MIGRATIONS: "true"
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health/').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Portni tashqariga OCHMAYMIZ — faqat nginx orqali kirish mumkin.
    expose:
      - "8000"

  bot_auth:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/ruxshona2103/hr_project_bot_auth:latest
    restart: unless-stopped
    command: python -m apps.users1.bot
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      DJANGO_SETTINGS_MODULE: config.settings
      RUN_MIGRATIONS: "false"
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      web:
        condition: service_healthy

  bot_vacancy:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/ruxshona2103/hr_project_bot_vacancy:latest
    restart: unless-stopped
    command: python vacancy_bot/bot.py
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      DJANGO_SETTINGS_MODULE: config.settings
      RUN_MIGRATIONS: "false"
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      web:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - web

  # --- SSL sertifikat olish/yangilash uchun (birinchi marta qo'lda ishga tushiriladi, keyin cron/systemd timer bilan avtomatlashtiriladi) ---
  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: "true"

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  logs_volume:
  certbot_www:
  certbot_certs:
